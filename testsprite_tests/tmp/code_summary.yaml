version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 15 (App Router, Turbopack)
  - React 19
  - Tailwind CSS 4
  - Supabase (Auth, Database, Realtime, Edge Functions)
  - Stripe (Payments)
  - Groq SDK (AI/LLM)
  - Zod (Validation)
  - Recharts (Charts)
  - Motion (Animations)
  - Vercel (Hosting, Analytics, Speed Insights)
features:
  - name: Homepage
    description: Landing page with hero section, features overview, and navigation to all app sections
    files:
      - app/page.tsx
      - app/HomePageClient.tsx
    endpoints: []
    depends_on: []
  - name: Authentication
    description: User registration, login, password reset with Supabase Auth. Supports email/password and OAuth flows.
    files:
      - app/(auth)/login/page.tsx
      - app/(auth)/register/page.tsx
      - app/(auth)/forgot-password/page.tsx
      - app/(auth)/reset-password/page.tsx
      - app/auth/login/page.tsx
      - app/auth/register/page.tsx
      - app/auth/auth-code-error/page.tsx
      - lib/auth/context.tsx
      - middleware.ts
    endpoints: []
    depends_on: []
  - name: Essay Submission & Correction
    description: Students submit essays on generated themes. AI (Groq) corrects them using ENEM 5-competency rubric with detailed feedback.
    files:
      - app/redacao/page.tsx
      - app/api/corrigir/route.ts
      - app/api/gerar-tema/route.ts
    endpoints:
      - method: POST
        path: /api/corrigir
        description: Submit essay text for AI correction
        auth_required: true
      - method: GET
        path: /api/corrigir
        description: Retrieve essay correction by ID
        auth_required: true
      - method: GET
        path: /api/gerar-tema
        description: Generate a unique essay theme with support texts
        auth_required: false
    depends_on:
      - Authentication
  - name: Essay Results
    description: View detailed essay correction results including scores per ENEM competency
    files:
      - app/resultados/[id]/page.tsx
      - app/api/resultados/[id]/route.ts
    endpoints:
      - method: GET
        path: /api/resultados/{id}
        description: Get essay result by ID for authenticated user
        auth_required: true
    depends_on:
      - Authentication
      - Essay Submission & Correction
  - name: Quiz Questions
    description: AI-generated quiz questions by discipline (Math, Portuguese, Chemistry, Physics, Geography) with answer tracking
    files:
      - app/questoes/page.tsx
      - app/api/questoes/route.ts
    endpoints:
      - method: GET
        path: /api/questoes
        description: Generate quiz questions by discipline
        auth_required: false
      - method: POST
        path: /api/questoes
        description: Save quiz results and recalculate user stats
        auth_required: false
    depends_on: []
  - name: User Account
    description: User profile management, statistics dashboard, and account editing
    files:
      - app/conta/page.tsx
      - app/conta/editar/page.tsx
      - app/api/conta/dados/route.ts
      - app/api/conta/recalcular/route.ts
    endpoints:
      - method: GET
        path: /api/conta/dados
        description: Get authenticated user account data and stats
        auth_required: true
      - method: POST
        path: /api/conta/recalcular
        description: Recalculate user statistics
        auth_required: true
    depends_on:
      - Authentication
  - name: Community Forum
    description: Community forum with topics, posts, comments, likes, and real-time updates via SSE
    files:
      - app/comunidade/page.tsx
      - app/api/comunidade/posts/route.ts
      - app/api/comunidade/comments/route.ts
      - app/api/comunidade/threads/route.ts
      - app/api/comunidade/likes/route.ts
      - app/api/realtime-proxy/route.ts
    endpoints:
      - method: POST
        path: /api/comunidade/posts
        description: Create a community post
        auth_required: true
      - method: POST
        path: /api/comunidade/comments
        description: Create a comment on a post
        auth_required: true
      - method: GET
        path: /api/comunidade/threads
        description: Get posts and comments for a topic
        auth_required: false
      - method: POST
        path: /api/comunidade/likes
        description: Batch query likes for multiple posts
        auth_required: false
      - method: GET
        path: /api/realtime-proxy
        description: SSE proxy for real-time community updates
        auth_required: false
    depends_on:
      - Authentication
  - name: Achievements System
    description: Gamification with unlockable achievements based on user activity
    files:
      - app/api/conquistas/route.ts
    endpoints:
      - method: POST
        path: /api/conquistas
        description: Check and unlock achievements based on user stats
        auth_required: true
    depends_on:
      - Authentication
      - User Account
  - name: News Section
    description: Education news with search, filtering, featured articles, and admin moderation
    files:
      - app/noticias/page.tsx
      - app/noticias/[slug]/page.tsx
      - app/noticias/pesquisa/page.tsx
      - app/noticias/admin/page.tsx
      - app/api/noticias/route.ts
      - app/api/noticias/busca/route.ts
      - app/api/noticias/importar/route.ts
    endpoints:
      - method: GET
        path: /api/noticias
        description: List news articles with pagination and filtering
        auth_required: false
      - method: GET
        path: /api/noticias/busca
        description: Full-text search news by keyword
        auth_required: false
      - method: POST
        path: /api/noticias/importar
        description: Import news from NewsAPI (admin only)
        auth_required: true
    depends_on: []
  - name: Donation (Stripe)
    description: Stripe-powered donation flow with configurable amounts and webhook processing
    files:
      - app/doacao/page.tsx
      - app/doacao/sucesso/page.tsx
      - app/api/doacao/checkout/route.ts
      - app/api/doacao/webhook/route.ts
    endpoints:
      - method: POST
        path: /api/doacao/checkout
        description: Create Stripe checkout session for donation
        auth_required: false
      - method: POST
        path: /api/doacao/webhook
        description: Stripe webhook handler for payment events
        auth_required: false
    depends_on: []
  - name: Admin Maintenance
    description: Admin tools for cache cleanup, featured news update, and system maintenance
    files:
      - app/api/admin/manutencao/route.ts
      - app/api/atualizarDestaques/route.ts
    endpoints:
      - method: POST
        path: /api/admin/manutencao
        description: Clean expired caches and old analytics
        auth_required: true
      - method: GET
        path: /api/atualizarDestaques
        description: Update featured news using AI selection
        auth_required: true
    depends_on: []
  - name: Static Pages
    description: About, Privacy Policy, and Terms of Service pages
    files:
      - app/sobre/page.tsx
      - app/privacidade/page.tsx
      - app/termos/page.tsx
    endpoints: []
    depends_on: []
known_limitations:
  - issue: Server returns HTTP 500 when environment variables are missing
    location: app/page.tsx
    impact: Homepage and features fail without proper .env.local configuration
  - issue: No automated test suite
    location: project root
    impact: No regression testing coverage
